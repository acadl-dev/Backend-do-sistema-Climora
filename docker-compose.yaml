services:
  postgres:
    image: postgres:18
    container_name: climora-postgres
    environment:
      POSTGRES_DB: climora_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d climora_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
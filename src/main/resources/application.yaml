spring:
  application:
    name: climora-backend
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/climora_dev
    username: postgres
    password: postgres
  spring:
    jpa:
      hibernate:
        ddl-auto: validate
      open-in-view: false
server:
  port: 9090

# O validate é importante: quem cria as tabelas é o Flyway, e o Hibernate só confere se as entidades batem com o banco.
# Se algo estiver diferente, a aplicação nem sobe, o que te avisa cedo de qualquer divergência.